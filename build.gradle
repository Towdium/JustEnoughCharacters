import com.google.gson.GsonBuilder
import com.google.gson.JsonObject

plugins {
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id "architectury-plugin" version "3.4-SNAPSHOT" apply false
    id 'dev.architectury.loom' version '1.1-SNAPSHOT' apply false
    id 'io.github.juuxel.loom-quiltflower' version '1.7.1' apply false
    id "io.github.p03w.machete" version "1.+" // automatic jar compressing on build
    id 'io.freefair.lombok' version '8.0.1' apply false
}

group = "me.towdium.jecharacters"
archivesBaseName = "jecharacters"
version = "${verspec}.${verbuild}"

allprojects {
    repositories {
        mavenCentral()
        mavenLocal()
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.blamejared.com/" }
        maven { url = "https://modmaven.dev" }
        maven { url = "https://maven.parchmentmc.org" }
        maven { url = "https://libraries.minecraft.net" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        maven { url = "https://modmaven.dev" }
        maven {
            url = "https://cursemaven.com"
            content { includeGroup "curse.maven" }
        }
        maven { url = "https://www.jitpack.io" }
    }
}

configurations {
    shade
    compileOnly.extendsFrom shade
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('buildAll', Copy).configure { task ->
    subprojects.forEach { p ->
        if (ProjectType.getType(p) == ProjectType.ROOT) {
            task.dependsOn(":${p.name}:forge:build")
            task.dependsOn(":${p.name}:fabric:build")
        }
    }
}

tasks.register("cleanBuild", Delete).configure { task ->
    subprojects.forEach { p ->
        if (ProjectType.getType(p) == ProjectType.ROOT) {
            delete("${p.projectDir}/forge/build/libs")
            delete("${p.projectDir}/fabric/build/libs")
        }
    }
}

subprojects.each { p ->
    if (ProjectType.getType(p) == ProjectType.ROOT) {
        rootProject.tasks.register("build-${p.name}", Copy).configure { task ->
            task.dependsOn(":${p.name}:forge:build")
            task.dependsOn(":${p.name}:fabric:build")
        }
    }
}


enum ProjectType {
    MAIN,
    ROOT,
    COMMON,
    FORGE,
    FABRIC,

    static ProjectType getType(Project p) {
        try {
            if (p.name.contains("main"))
                return MAIN
            return valueOf(p.name.toUpperCase())
        } catch (Exception ignored) {
            return ROOT
        }
    }

    boolean notMain() {
        return this != MAIN
    }

    boolean notRoot() {
        return this != ROOT
    }

    boolean isRoot() {
        return this == ROOT
    }

    boolean notMainOrRoot() {
        return this != MAIN && this != ROOT
    }

    boolean isFabric() {
        return this == FABRIC
    }

    boolean isForge() {
        return this == FORGE
    }

    boolean isCommon() {
        return this == COMMON
    }

    boolean isImpl() {
        return this == FABRIC || this == FORGE
    }
}

subprojects { Project p ->
    apply plugin: 'java-library'
    apply plugin: 'com.github.johnrengelman.shadow'
    apply plugin: 'io.freefair.lombok'

    def type = ProjectType.getType(p)
    if (type.impl) {
        apply plugin: 'dev.vfyjxf.gradle.jech'
    }
    if (type.notMain()) {
        apply plugin: 'architectury-plugin'
        if (type.notRoot()) {
            apply plugin: 'io.github.juuxel.loom-quiltflower'
        }
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(17)
    java.withSourcesJar()

    p.archivesBaseName = rootProject.archivesBaseName
    p.group = rootProject.group
    p.version = "${verspec}.${verbuild}"

    if (type != ProjectType.MAIN) {
        def mc_version = type == ProjectType.ROOT ? p.mc_version : p.getParent().mc_version
        p.archivesBaseName += "-${mc_version}-${type.toString().toLowerCase()}"
    }

    p.processResources {
        // Exclude .cache directory which is generated by DataGen.
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        exclude '.cache'
    }

    p.afterEvaluate { Project pAfter ->

        if (type.notRoot()) {
            pAfter.dependencies {
                if (pAfter.configurations.findByName("shadowCommon")) {
                    shadowCommon(group: 'dev.ghostflyby', name: 'PinIn', version: "${verpinin}") {
                        transitive = false
                    }
                }
            }
        }

        if (type.notMain()) {
            pAfter.dependencies {
                compileOnly rootProject.project(":common-main")
                if (type.fabric) {
                    compileOnly rootProject.project(":fabric-main")
                }
                if (type.forge) {

                    if (!pAfter.path.contains("1.16.5")) {
                        compileOnly rootProject.project(":forge-main")
                    }
                }
            }
        }

        if (type.fabric || type.forge) {
            //source sets
            {
                def main = rootProject.project(":common-main")
                pAfter.compileJava {
                    source(main.sourceSets.main.allSource)
                }
                pAfter.sourcesJar {
                    from main.sourceSets.main.allJava
                }
                pAfter.processResources {
                    from main.sourceSets.main.resources
                }

                if (type.fabric) {
                    def fabricBase = rootProject.project(":fabric-main")
                    pAfter.compileJava {
                        source(fabricBase.sourceSets.main.allSource)
                    }
                    pAfter.sourcesJar {
                        from fabricBase.sourceSets.main.allJava
                    }
                    pAfter.processResources {
                        from fabricBase.sourceSets.main.resources
                    }
                }
                if (type.forge && !pAfter.path.contains("1.16.5")) {
                    def forgeBase = rootProject.project(":forge-main")
                    pAfter.compileJava {
                        source(forgeBase.sourceSets.main.allSource)
                    }
                    pAfter.sourcesJar {
                        from forgeBase.sourceSets.main.allJava
                    }

                    def discoveredCoremodScripts = pAfter.files()
                    [pAfter.sourceSets.main.resources,
                     forgeBase.sourceSets.main.resources].each { resourceSet ->
                        resourceSet.srcDirs.each { File resourceDirectory ->
                            discoveredCoremodScripts.from(
                                    pAfter.fileTree(resourceDirectory) {
                                        include 'coremods/**/*_transformer.js'
                                    }
                            )
                        }
                    }

                    def generatedCoremodsResources = pAfter.layout.buildDirectory.dir('generated/resources/coremods')
                    def generateCoremodsJson = pAfter.tasks.register(
                            'generateCoremodsJson',
                            GenerateCoremodsJson
                    ) {
                        coremodScripts.from(discoveredCoremodScripts)
                        outputFile.set(generatedCoremodsResources.map {
                            it.file('META-INF/coremods.json')
                        })
                    }
                    pAfter.processResources {
                        dependsOn(generateCoremodsJson)

                        from(forgeBase.sourceSets.main.resources)
                        from(generatedCoremodsResources)
                    }
                }
            }

            pAfter.jar {
                archiveClassifier = "slim"
                manifest.attributes([
                        "Specification-Title"     : 'Just Enough Characters',
                        "Specification-Vendor"    : 'Towdium,vfyjxf_',
                        "Specification-Version"   : "${verspec}",
                        "Implementation-Title"    : rootProject.name,
                        "Implementation-Version"  : "${verspec}.${verbuild}",
                        "Implementation-Vendor"   : 'Towdium',
                        "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                        "Automatic-Module-Name"   : "jecharacters"
                ])
            }

        }
    }
}



abstract class GenerateCoremodsJson extends DefaultTask {

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getCoremodScripts()

    @OutputFile
    abstract RegularFileProperty getOutputFile()

    @TaskAction
    void generate() {
        Map<String, String> entries = new TreeMap<>()

        coremodScripts.files
                .findAll(File::isFile)
                .sort { first, second -> GenerateCoremodsJson.normalizePath(first) <=> GenerateCoremodsJson.normalizePath(second) }
                .each { File script ->
                    String absolutePath = GenerateCoremodsJson.normalizePath(script)
                    int coremodsIndex = absolutePath.lastIndexOf('/coremods/')

                    if (coremodsIndex < 0) {
                        throw new GradleException("CoreMod script is not inside a coremods directory: ${script}")
                    }
                    String resourcePath =
                            absolutePath.substring(coremodsIndex + 1)

                    String fileName = script.name
                    String identifier = fileName.substring(0, fileName.length() - '.js'.length())

                    String previous = entries.putIfAbsent(identifier, resourcePath)
                    if (previous != null && previous != resourcePath) {
                        throw new GradleException("Duplicate CoreMod identifier '${identifier}': " + "'${previous}' and '${resourcePath}'")
                    }
                }

        JsonObject json = new JsonObject()

        entries.each { String identifier, String resourcePath ->
            json.addProperty(identifier, resourcePath)
        }

        File output = outputFile.get().asFile
        output.parentFile.mkdirs()

        String content = new GsonBuilder()
                .setPrettyPrinting()
                .create()
                .toJson(json)

        output.setText(content + System.lineSeparator(), 'UTF-8')
    }

    private static String normalizePath(File file) {
        return file.absolutePath.replace(File.separator, '/')
    }
}

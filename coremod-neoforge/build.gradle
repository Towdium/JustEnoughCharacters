plugins {
    id 'java'
    id 'dev.vfyjxf.gradle.jech'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Compile against FML 12 (Java 25) while keeping the shared coremod usable by legacy targets.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

configurations.compileClasspath.attributes {
    attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
}

jar {
    manifest {
        attributes([
                "FMLModType": "LIBRARY"
        ])
    }
}

repositories {
    maven {
        url = "https://libraries.minecraft.net"
        metadataSources {
            mavenPom()
        }
    }
    maven {
        url = "https://maven.neoforged.net/releases"
    }
}

dependencies {
    compileOnly "net.neoforged.fancymodloader:loader:${fml_unobfuscated_version}"
    implementation project(":coremod-common")
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'
}

compileJava {
    source(project(":coremod-common").sourceSets.main.allSource)
}

processResources {
    from project(":coremod-common").sourceSets.main.resources
}

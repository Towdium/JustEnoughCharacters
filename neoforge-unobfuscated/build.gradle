plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev'
}

version = "${verspec}.${verbuild}"
def quickPlaySingleplayerWorld = providers.gradleProperty("quickPlaySingleplayerWorld")

base {
    archivesName = mod_id + '-' + minecraft_version + '-neoforge'
}
neoForge {
    version = neo_unobfuscated_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.add(at.absolutePath)
    }

    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            gameDirectory = project.layout.projectDirectory.dir("run/client/Dev")
            if (quickPlaySingleplayerWorld.isPresent()) {
                programArgument "--quickPlaySingleplayer"
                programArgument quickPlaySingleplayerWorld.get()
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    jarJar(project(':coremod-neoforge'))
    jarJar(implementation("com.github.towdium:PinIn:${verpinin}"))
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_unobfuscated_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_unobfuscated_version}"
    // FakeTree supports older JEI implementations; modern JEI no longer publishes a core artifact.
    compileOnly "mezz.jei:jei-1.21.11-core:27.4.0.24"
    compileOnly "mezz.jei:jei-${minecraft_version}-common:${jei_unobfuscated_version}"
    compileOnly('net.mezzdev:suffixtree:1.1.0') {
        transitive = false
    }
    compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'
}

// Compile shared sources against this target's Minecraft API, without building legacy module binaries.
compileJava {
    source(project(":common").sourceSets.main.allSource)
    source(project(":common-unobfuscated").sourceSets.main.allSource)
}

processResources {
    from(project(":common").sourceSets.main.resources) {
        exclude 'pack.mcmeta'
    }
    from project(":common-unobfuscated").sourceSets.main.resources
}


var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_version         : version,
            minecraft_version   : minecraft_version,
            neo_version         : neo_unobfuscated_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

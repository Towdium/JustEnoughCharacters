
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.95'
}

version = mod_version
group = 'me.towdium.jecharacters.uitest'

def jechJarProp = providers.gradleProperty('jechJar')
def jeiJarProp = providers.gradleProperty('jeiJar')
def requireJar = { name, prop ->
    if (!prop.isPresent()) {
        throw new GradleException(
            "the ${name} project property is required: this build tests jars it is handed "
                + "(jt passes it; by hand: -P${name}=/abs/path.jar)"
        )
    }
    def file = new File(prop.get())
    if (!file.isFile()) {
        throw new GradleException("the ${name} project property names no file: ${file}")
    }
    return file
}
def jechJarFile = requireJar('jechJar', jechJarProp)
def jeiJarFile = requireJar('jeiJar', jeiJarProp)


def jechUiTestRunDir = project.findProperty('jechRunDir')?.toString()
def jechUiTestOutDir = jechUiTestRunDir == null
        ? new File(projectDir, 'runs/client-tests')
        : new File(jechUiTestRunDir, 'uitest')
def jechUiTestSelection = project.findProperty('jechTest')?.toString()
def jechUiTestExclude = project.findProperty('jechTestExclude')?.toString() ?: ''
def jechUiTestGuiScale = project.findProperty('jechTestGuiScale')?.toString()
def jechUiTestWindow = project.findProperty('jechTestWindow')?.toString()
def jechUiTestInputMode = project.findProperty('jechTestInputMode')?.toString()
def jechUiTestWatchdogSec = project.findProperty('jechTestWatchdogSec')?.toString()
def jechUiTestKeepOpen = project.hasProperty('jechTestKeepOpen')
def jechUiTestHeadless = project.hasProperty('jechTestHeadless')

if (jechUiTestHeadless && jechUiTestInputMode != null && jechUiTestInputMode.equalsIgnoreCase('REAL')) {
    throw new GradleException(
        '-PjechTestHeadless cannot be combined with -PjechTestInputMode=REAL: the real input driver '
            + 'moves the OS cursor and needs a visible, focused window'
    )
}

def jechUiTestWindowWidth = null
def jechUiTestWindowHeight = null
if (jechUiTestWindow != null) {
    def parts = jechUiTestWindow.toLowerCase().split('x')
    if (parts.length == 2) {
        jechUiTestWindowWidth = parts[0].trim()
        jechUiTestWindowHeight = parts[1].trim()
    }
}

base {
    archivesName = 'jechtest-' + minecraft_version + '-neoforge'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// The engine's row-independent sources live in one shared tree at the repository root
// (engine/modern/src/main/java); this build compiles them alongside its own sources.
sourceSets.main.java.srcDir '../../engine/modern/src/main/java'

repositories {
    maven { url = 'https://jitpack.io' }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly files(jechJarFile)
    localRuntime files(jechJarFile)
    localRuntime files(jeiJarFile)
    compileOnly "com.github.towdium:PinIn:${verpinin}"
    compileOnly 'org.jspecify:jspecify:1.0.1'
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    mods {
        jechtest {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        clientTests {
            client()
            if (jechUiTestRunDir != null) {
                gameDirectory = layout.dir(providers.provider { new File(jechUiTestRunDir) })
            } else {
                gameDirectory = jechUiTestOutDir
            }
            if (jechUiTestSelection != null) {
                systemProperty 'jech.uitest.run', jechUiTestSelection
                systemProperty 'jech.uitest.out', jechUiTestOutDir.absolutePath
                systemProperty 'jech.uitest.exclude', jechUiTestExclude
                if (jechUiTestGuiScale != null) systemProperty 'jech.uitest.guiScale', jechUiTestGuiScale
                if (jechUiTestWindowWidth != null) systemProperty 'jech.uitest.windowWidth', jechUiTestWindowWidth
                if (jechUiTestWindowHeight != null) systemProperty 'jech.uitest.windowHeight', jechUiTestWindowHeight
                if (jechUiTestInputMode != null) systemProperty 'jech.uitest.inputMode', jechUiTestInputMode
                if (jechUiTestWatchdogSec != null) systemProperty 'jech.uitest.watchdogSec', jechUiTestWatchdogSec
                if (jechUiTestKeepOpen) systemProperty 'jech.uitest.keepOpen', 'true'
            }
            if (jechUiTestHeadless) systemProperty 'jech.uitest.headless', 'true'
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range: "[${minecraft_version},)",
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def jechUiTestCleanReport = tasks.register('jechCleanUiTestReport', Delete) {
    group = 'verification'
    description = 'Deletes the previous JECh UI test run output.'
    if (jechUiTestRunDir == null) {
        delete providers.provider {
            def children = jechUiTestOutDir.listFiles()
            children == null ? [] : children.findAll { it.name != 'jech-scenarios' }
        }
    } else {
        delete jechUiTestOutDir
    }
}

def jechUiTestPresetOptions = tasks.register('jechPresetUiTestOptions') {
    group = 'verification'
    description = 'Writes the options.txt a bare harness run needs into the harness game directory.'
    onlyIf { jechUiTestSelection != null && jechUiTestRunDir == null }
    dependsOn jechUiTestCleanReport
    def outDir = jechUiTestOutDir
    inputs.property('jechUiTestOptions', 'onboardAccessibility:true\nlang:zh_cn\n')
    outputs.file(new File(outDir, 'options.txt'))
    doLast {
        def preset = new File(outDir, 'options.txt')
        preset.parentFile.mkdirs()
        preset.text = 'onboardAccessibility:true\nlang:zh_cn\n'
        logger.lifecycle("jechtest-uitest: preset ${preset} (${preset.text.trim().replace('\n', ', ')})")
    }
}

def jechUiTestVerify = tasks.register('verifyJechUiTest') {
    group = 'verification'
    description = 'Reads the UI test report and fails the build unless every scenario passed.'
    onlyIf { jechUiTestSelection != null }
    doLast {
        def report = new File(jechUiTestOutDir, 'report.json')
        if (!report.isFile()) {
            throw new GradleException(
                "no UI test report at ${report} - the client crashed, never reached the runner, "
                    + 'or -PjechTest matched no scenarios'
            )
        }
        def run = new groovy.json.JsonSlurper().parse(report)
        def totals = run.totals
        logger.lifecycle(
            "jechtest-uitest ${run.status}: ${totals.passed}/${totals.scenarios} scenarios passed, "
                + "${totals.checks - totals.checksFailed}/${totals.checks} checks passed, "
                + "${totals.captures} captures, ${run.durationMs} ms"
        )
        def failures = []
        run.scenarios.each { scenario ->
            if (scenario.status != 'PASS') {
                failures.add("scenario ${scenario.name}: ${scenario.status}"
                    + (scenario.message == null ? '' : " (${scenario.message})"))
            }
            scenario.steps.each { step ->
                if (step.status != 'PASS') {
                    logger.error("  step ${step.index} ${step.name}: ${step.status}"
                        + (step.waitingFor == null ? '' : " waitingFor=${step.waitingFor}"))
                    step.checks.each { check ->
                        if (!check.passed) {
                            logger.error("    check ${check.label} FAILED"
                                + (check.detail == null ? '' : " (${check.detail})"))
                        }
                    }
                    step.captures.each { capture ->
                        logger.error("    capture ${capture.path}"
                            + (capture.suspect ? ' SUSPECT flat colour' : ''))
                    }
                    if (step.error != null) {
                        logger.error("    error ${step.error.type}: ${step.error.message}")
                    }
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('UI test failed:\n  ' + failures.join('\n  '))
        }
    }
}

tasks.configureEach { task ->
    if (task.name != 'runClientTests' || jechUiTestSelection == null) return
    task.dependsOn jechUiTestCleanReport
    task.dependsOn jechUiTestPresetOptions
    task.finalizedBy jechUiTestVerify
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

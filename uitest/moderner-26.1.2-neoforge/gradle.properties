# Gradle — the wrapper is the moderner checkout's Gradle 9.5, which runs on the
# machine's default JDK; the client's JDK 25 comes from the toolchain below.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# The mod under test (its id is what the harness's mods.toml depends on).
mod_id=jecharacters

# The harness mod's own version, expanded into its neoforge.mods.toml.
mod_version=1.0.0

# PinIn, the library the mod under test loads at runtime; compile-only here
# because the JECh jar under test embeds it (jarJar) and FML unpacks it in a
# dev run, while the compiler needs it for the TreeSearcher signatures the
# recorder's JechSearchStorage tap walks.
verpinin=1.6.0

# Platform — the 26.1.2 (unobfuscated) line of the moderner checkout: the same
# versions neoforge-unobfuscated builds against (its gradle.properties carries
# minecraft_version=26.1.2; the NeoForge version is spelled in its build.gradle).
# MC 26.x ships unobfuscated official jars, so there is no parchment layer here
# at all (the checkout's own parchment block targets 1.21.10 and is inert for
# this line; the standalone was measured without it).
minecraft_version=26.1.2
neo_version=26.1.2.59-beta
# The ranges are this line's own: the checkout's root properties describe
# 1.21.10 (neo_version_range=[21.10.64,) does not even contain this NeoForge),
# so they must not be copied.
neo_version_range=[26.1.2.59-beta,)
loader_version_range=[4,)
minecraft_version_range=[26.1.2,)

# The jars under test are NOT declared here: they are passed in as project
# properties on every run, by jt (which builds/pins them) or by hand —
#   ./gradlew runClientTests -PjechTest=all \
#     -PjechJar=/abs/jecharacters-26.1.2-neoforge-<build>.jar \
#     -PjeiJar=/abs/jei-26.1.2-neoforge-29.16.0.46.jar
# so the harness always tests the artifact jt resolved, never a copy that could
# drift from it.

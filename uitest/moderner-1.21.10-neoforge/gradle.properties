# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# The mod under test (its id is what the harness's mods.toml depends on).
mod_id=jecharacters

# The harness mod's own version, expanded into its neoforge.mods.toml.
mod_version=1.0.0

# PinIn, the library the mod under test loads at runtime; declared here for the
# compiler only — the JECh jar under test embeds it (jar-in-jar) and the dev
# run's FML unpacks it, while the recorder's JechSearchStorage tap needs the
# TreeSearcher types on the compile classpath.
verpinin=1.6.0

# Platform — mirrors moderner/gradle.properties of the JECh checkout.
minecraft_version=1.21.10
parchment_minecraft_version=1.21.10
parchment_mappings_version=2025.10.12
neo_version=21.10.64
neo_version_range=[21.10.64,)
loader_version_range=[4,)
minecraft_version_range=[1.21.10,)

# The jars under test are NOT declared here: they are passed in as project
# properties on every run, by jt (which builds/pins them) or by hand —
#   ./gradlew runClientTests -PjechTest=all \
#     -PjechJar=/abs/jecharacters-1.21.10-neoforge-<build>.jar \
#     -PjeiJar=/abs/jei-1.21.10-neoforge-26.3.0.31.jar
# so the harness always tests the artifact jt resolved, never a copy that could
# drift from it.

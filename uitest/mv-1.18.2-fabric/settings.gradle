pluginManagement {
    repositories {
        // Stock fabric-loom, the plugin the multiple-version checkout itself pins
        // for these lines (id 'fabric-loom' version '1.10.5' in that repo's
        // pluginManagement). The architectury maven that used to sit here was what
        // architectury-loom 1.1 resolved from, and it went with that plugin; the
        // Forge maven beside it carried loom 1.1's ForgeGradle toolchain deps
        // (installertools, mcinjector, DiffPatch) and went the same way. What is
        // left is the repository list the already-converted uitest/1.21.1-fabric
        // row resolves stock fabric-loom from.
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'jech-uitest-mv-1.18.2-fabric'

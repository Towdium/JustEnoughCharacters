pluginManagement {
    repositories {
        // Architectury Loom — the plugin the multiple-version checkout itself uses for
        // these lines, which is why it resolves from the Architectury maven rather than
        // the fabric one (fabric-loom proper has no 1.1 line to offer).
        maven { url = 'https://maven.architectury.dev/' }
        maven { url "https://maven.fabricmc.net/" }
        // loom 1.1's own toolchain deps (installertools, mcinjector, DiffPatch) live
        // on the Forge maven — the same repo list the multiple-version checkout's
        // settings.gradle carries for this plugin.
        maven { url "https://maven.minecraftforge.net/" }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'jech-uitest-mv-1.18.2-fabric'

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# The mod under test (its id is what the harness's fabric.mod.json depends on).
mod_id=jecharacters

# The harness mod's own version, expanded into its fabric.mod.json.
mod_version=1.0.0

# Platform — mirrors 1.18.2/gradle.properties of the multiple-version checkout
# (loader 0.14.9 + api 0.67.0+1.18.2 are the pins that checkout's own dev run is
# green with; see Data/jech-compat/port-sheets/mv-lines.md §4.1). Note there is
# no PinIn here: the mv 4.6.12 jar under test embeds it (jar-in-jar), and unlike
# the 1.21.1 harness this copy carries no JechSearchStorage tap whose signatures
# would walk PinIn types, so the compiler never needs the library.
minecraft_version=1.18.2
fabric_loader_version=0.14.9
# The fabric-api of the run: the same pinned version the env's fabric-api
# artifact names (the dev run gets it as a remapped Gradle dependency, which is
# what a loom run natively loads).
fabric_version=0.67.0+1.18.2

# The jars under test are NOT declared here: they are passed in as project
# properties on every run, by jt (which builds/pins them) or by hand —
#   ./gradlew runClient -PjechTest=all \
#     -PjechJar=/abs/jecharacters-1.18.2-fabric-4.6.12.jar \
#     -PjeiJar=/abs/jei-1.18.2-fabric-10.2.1.1005.jar
# so the harness always tests the artifact jt resolved, never a copy that could
# drift from it.

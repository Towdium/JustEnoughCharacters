# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# The mod under test (its id is what the harness's fabric.mod.json depends on).
mod_id=jecharacters

# The harness mod's own version, expanded into its fabric.mod.json.
mod_version=1.0.0

# PinIn, the library the mod under test loads at runtime; compile-only here
# because the JECh jar under test embeds it (jar-in-jar) and the loader unpacks
# it, while the compiler needs it for the TreeSearcher signatures the recorder
# walks.
verpinin=1.6.0

# Platform — mirrors moderner/gradle.properties of the JECh checkout.
minecraft_version=1.21.10
fabric_loader_version=0.19.2
# The fabric-api of the run: the same pinned version the env's fabric-api
# artifact names (the dev run gets it as a remapped Gradle dependency, which is
# what a loom run natively loads).
fabric_version=0.138.3+1.21.10

# The jars under test are NOT declared here: they are passed in as project
# properties on every run, by jt (which builds/pins them) or by hand —
#   ./gradlew runClient -PjechTest=all \
#     -PjechJar=/abs/jecharacters-1.21.10-fabric-<build>.jar \
#     -PjeiJar=/abs/jei-1.21.10-fabric-26.3.0.31.jar
# so the harness always tests the artifact jt resolved, never a copy that could
# drift from it.

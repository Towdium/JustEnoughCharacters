# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# ForgeGradle 7 / Forge 1.12.2 — mirrors 1.12.0/gradle.properties of the JECh
# checkout (the line whose harness this build owns). The client's JDK is the
# toolchain below (8); the wrapper itself runs on whichever JAVA_HOME jt hands
# it (the env's java version, a 17+ JDK this Gradle can start on).
gradle_version=7.0.31
minecraft_version=1.12.2
forge_version=14.23.5.2864
mapping_version=20180410-1.12

# The jars under test are NOT declared here: they are passed in as project
# properties on every run, by jt (which builds/pins them) or by hand —
#   ./gradlew runClient -PjechTest=all \
#     -PjechJar=/abs/jecharacters-1.12.0-<build>-srg.jar \
#     -PjeiJar=/abs/jei_1.12.2-4.16.1.301.jar   # or the HadEnoughItems jar
# so the harness always tests the artifact jt resolved, never a copy that could
# drift from it. Which JEI-line mod a run stages is decided by the jar handed
# over (-PjeiJar), not by a property of this build.

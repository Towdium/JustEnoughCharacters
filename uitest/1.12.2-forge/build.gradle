
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version "${gradle_version}"
}

version = '1.0'
group = 'me.towdium.jecharacters.uitest'
base {
    archivesName = 'jechtest-' + minecraft_version + '-forge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: 'snapshot', version: mapping_version
}

def jechJarProp = providers.gradleProperty('jechJar')
def jeiJarProp = providers.gradleProperty('jeiJar')
def requireJar = { name, prop ->
    if (!prop.isPresent()) {
        throw new GradleException(
            "the ${name} project property is required: this build tests jars it is handed "
                + "(jt passes it; by hand: -P${name}=/abs/path.jar)"
        )
    }
    def file = new File(prop.get())
    if (!file.isFile()) {
        throw new GradleException("the ${name} project property names no file: ${file}")
    }
    return file
}
def jechJarFile = requireJar('jechJar', jechJarProp)
def jeiJarFile = requireJar('jeiJar', jeiJarProp)


def jechUiTestRunDir = project.findProperty('jechRunDir')?.toString()
def jechUiTestGameDir = jechUiTestRunDir == null
        ? new File(projectDir, 'runs/client-tests')
        : new File(jechUiTestRunDir)
def jechUiTestOutDir = jechUiTestRunDir == null
        ? jechUiTestGameDir
        : new File(jechUiTestRunDir, 'uitest')
def jechUiTestSelection = project.findProperty('jechTest')?.toString()
def jechUiTestExclude = project.findProperty('jechTestExclude')?.toString() ?: ''
def jechUiTestGuiScale = project.findProperty('jechTestGuiScale')?.toString()
def jechUiTestInputMode = project.findProperty('jechTestInputMode')?.toString()
def jechUiTestWatchdogSec = project.findProperty('jechTestWatchdogSec')?.toString()
def jechUiTestKeepOpen = project.hasProperty('jechTestKeepOpen')
def jechUiTestHeadless = project.hasProperty('jechTestHeadless')

if (jechUiTestHeadless && jechUiTestInputMode != null && jechUiTestInputMode.equalsIgnoreCase('REAL')) {
    throw new GradleException(
        '-PjechTestHeadless cannot be combined with -PjechTestInputMode=REAL: the real input driver '
            + 'moves the OS cursor and needs a visible, focused window'
    )
}

def hostIsArm64Mac = System.getProperty('os.name').startsWith('Mac') &&
        System.getProperty('os.arch') == 'aarch64'
def lwjgl2Arm64NativesRepo = layout.buildDirectory.dir('lwjgl2-arm64-natives-repo')

repositories {
    if (hostIsArm64Mac) {
        maven {
            url = lwjgl2Arm64NativesRepo
            content {
                includeModule 'org.lwjgl.lwjgl', 'lwjgl-platform'
                includeModule 'net.java.jinput', 'jinput-platform'
                includeModule 'ca.weblite', 'java-objc-bridge'
            }
        }
    }
    maven {
        url = 'https://libraries.minecraft.net/'
        content { includeGroup 'ca.weblite' }
    }
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    if (hostIsArm64Mac) {
        implementation 'com.mojang:text2speech:1.11.3'
    }
}

minecraft {
    runs {
        register('client') {
            workingDir = jechUiTestGameDir
            systemProperty 'fml.coreMods.load',
                    'me.towdium.jecharacters.core.JechCore,me.towdium.jecharacters.uitest.core.UiTestCore'
            if (jechUiTestSelection != null) {
                systemProperty 'jech.uitest.run', jechUiTestSelection
                systemProperty 'jech.uitest.out', jechUiTestOutDir.absolutePath
                systemProperty 'jech.uitest.exclude', jechUiTestExclude
                if (jechUiTestGuiScale != null) systemProperty 'jech.uitest.guiScale', jechUiTestGuiScale
                if (jechUiTestInputMode != null) systemProperty 'jech.uitest.inputMode', jechUiTestInputMode
                if (jechUiTestWatchdogSec != null) systemProperty 'jech.uitest.watchdogSec', jechUiTestWatchdogSec
                if (jechUiTestKeepOpen) systemProperty 'jech.uitest.keepOpen', 'true'
            }
            if (jechUiTestHeadless) systemProperty 'jech.uitest.headless', 'true'
        }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach { task ->
    task.dependsOn tasks.named('classes')
    task.classpath sourceSets.main.output
    task.classpath files(jechJarFile)
    task.dependsOn 'stageUiTestDevMod'
}

tasks.register('stageUiTestDevMod') {
    group = 'verification'
    description = 'Stages the JEI-line jar under test into the harness game directory, its access transformer remapped from SRG to MCP member names.'
    def src = jeiJarFile
    def target = new File(jechUiTestGameDir, 'mods')
    inputs.file(src)
    outputs.dir(target)
    def remap = { String text, String entryName ->
        def out = new StringBuilder()
        text.readLines().each { String line ->
            int hash = line.indexOf('#')
            if (hash < 0) { out.append(line).append('\n'); return }
            def body = line.substring(0, hash).trim()
            def comment = line.substring(hash + 1).trim()
            def parts = body.split(/\s+/)
            if (parts.length != 3 || comment.isEmpty()) { out.append(line).append('\n'); return }
            def member = parts[2]
            int paren = member.indexOf('(')
            def srgName = paren < 0 ? member : member.substring(0, paren)
            def descriptor = paren < 0 ? '' : member.substring(paren)
            if (!(srgName ==~ /(func|field)_\d+.*/)) { out.append(line).append('\n'); return }
            def mcpName = comment.split(/\s+/)[0]
            if (!(mcpName ==~ /[A-Za-z_$][A-Za-z0-9_$]*/) || mcpName.startsWith('func_') || mcpName.startsWith('field_')) {
                throw new GradleException("no MCP name for ${srgName} in ${entryName} of a dev mod (comment was '${comment}')")
            }
            out.append("${parts[0]} ${parts[1]} ${mcpName}${descriptor} # ${comment}").append('\n')
        }
        return out.toString()
    }
    doLast {
        def dir = target
        dir.mkdirs()
        if (jechUiTestRunDir == null) {
            dir.listFiles()?.findAll { it.isFile() && it.name.toLowerCase(Locale.ROOT).endsWith('.jar') }?.each { it.delete() }
        }
        def dst = new File(dir, src.name)
        new java.util.zip.ZipFile(src).withCloseable { zip ->
            dst.withOutputStream { fos ->
                new java.util.zip.ZipOutputStream(fos).withCloseable { zos ->
                    zip.entries().each { entry ->
                        def newEntry = new java.util.zip.ZipEntry(entry.name)
                        if (!entry.isDirectory()) { newEntry.time = entry.time }
                        zos.putNextEntry(newEntry)
                        if (!entry.isDirectory()) {
                            byte[] data = zip.getInputStream(entry).withCloseable { it.bytes }
                            if (entry.name ==~ /META-INF\/[^\/]*_at\.cfg/) {
                                data = remap(new String(data, 'UTF-8'), entry.name).getBytes('UTF-8')
                            }
                            zos.write(data)
                        }
                        zos.closeEntry()
                    }
                }
            }
        }
        logger.lifecycle("jechtest-uitest: staged ${src.name} into ${dir}")
    }
}

tasks.register('stageLwjgl2Arm64Natives') {
    def repoDir = lwjgl2Arm64NativesRepo
    def downloadDir = layout.buildDirectory.dir('lwjgl2-arm64-natives-download')
    outputs.dir(repoDir)
    outputs.dir(downloadDir)
    onlyIf { hostIsArm64Mac }
    doLast {
        def repo = repoDir.get().asFile
        def download = { String url, File dest, String sha1 ->
            if (!dest.exists()) {
                dest.parentFile.mkdirs()
                (1..3).find { attempt ->
                    try {
                        dest.withOutputStream { out ->
                            new URL(url).openStream().withCloseable { it.transferTo(out) }
                        }
                        return true
                    } catch (Exception e) {
                        dest.delete()
                        if (attempt == 3) throw new GradleException("could not download ${url}", e)
                        sleep(2000 * attempt)
                        return false
                    }
                }
            }
            if (sha1 != null) {
                def actual = java.security.MessageDigest.getInstance('SHA-1')
                        .digest(dest.bytes).encodeHex().toString()
                if (actual != sha1) {
                    throw new GradleException("sha1 mismatch for ${dest.name}: ${actual}, expected ${sha1}")
                }
            }
            return dest
        }
        def serve = { String path, String content ->
            def file = new File(repo, path)
            if (!file.exists()) {
                file.parentFile.mkdirs()
                file.text = content
            }
            return file
        }
        def pom = { String group, String artifact, String version, String packaging, String dependencies = '' ->
            return """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0">
  <modelVersion>4.0.0</modelVersion>
  <groupId>${group}</groupId>
  <artifactId>${artifact}</artifactId>
  <version>${version}</version>
  <packaging>${packaging}</packaging>
${dependencies}</project>
"""
        }

        def lwjglVersion = '2.9.2-nightly-20140822'
        def lwjglPath = "org/lwjgl/lwjgl/lwjgl-platform/${lwjglVersion}/lwjgl-platform-${lwjglVersion}"
        serve("${lwjglPath}.pom", pom('org.lwjgl.lwjgl', 'lwjgl-platform', lwjglVersion, 'pom'))
        download('https://github.com/MinecraftMachina/lwjgl/releases/download/2.9.4-20150209-mmachina.2/lwjgl-platform-2.9.4-nightly-20150209-natives-osx.jar',
                new File(repo, "${lwjglPath}-natives-osx.jar"),
                'eff546c0b319d6ffc7a835652124c18089c67f36')
        download('https://libraries.minecraft.net/org/lwjgl/lwjgl/lwjgl-platform/2.9.2-nightly-20140822/lwjgl-platform-2.9.2-nightly-20140822-natives-linux.jar',
                new File(repo, "${lwjglPath}-natives-linux.jar"),
                'd898a33b5d0a6ef3fed3a4ead506566dce6720a5')
        download('https://libraries.minecraft.net/org/lwjgl/lwjgl/lwjgl-platform/2.9.2-nightly-20140822/lwjgl-platform-2.9.2-nightly-20140822-natives-windows.jar',
                new File(repo, "${lwjglPath}-natives-windows.jar"),
                '78b2a55ce4dc29c6b3ec4df8ca165eba05f9b341')

        def jinputVersion = '2.0.5'
        def jinputPath = "net/java/jinput/jinput-platform/${jinputVersion}/jinput-platform-${jinputVersion}"
        serve("${jinputPath}.pom", pom('net.java.jinput', 'jinput-platform', jinputVersion, 'pom'))
        download('https://github.com/r58Playz/jinput-m1/raw/main/plugins/OSX/bin/jinput-platform-2.0.5.jar',
                new File(repo, "${jinputPath}-natives-osx.jar"),
                '5189eb40db3087fb11ca063b68fa4f4c20b199dd')
        download('https://libraries.minecraft.net/net/java/jinput/jinput-platform/2.0.5/jinput-platform-2.0.5-natives-linux.jar',
                new File(repo, "${jinputPath}-natives-linux.jar"),
                '7ff832a6eb9ab6a767f1ade2b548092d0fa64795')
        download('https://libraries.minecraft.net/net/java/jinput/jinput-platform/2.0.5/jinput-platform-2.0.5-natives-windows.jar',
                new File(repo, "${jinputPath}-natives-windows.jar"),
                '385ee093e01f587f30ee1c8a2ee7d408fd732e16')

        def objcVersion = '1.0.0'
        def objcPath = "ca/weblite/java-objc-bridge/${objcVersion}/java-objc-bridge-${objcVersion}"
        serve("${objcPath}.pom", pom('ca.weblite', 'java-objc-bridge', objcVersion, 'jar', """  <dependencies>
    <dependency>
      <groupId>net.java.dev.jna</groupId>
      <artifactId>jna</artifactId>
      <version>4.1.0</version>
    </dependency>
  </dependencies>
"""))
        download('https://libraries.minecraft.net/ca/weblite/java-objc-bridge/1.0.0/java-objc-bridge-1.0.0.jar',
                new File(repo, "${objcPath}.jar"),
                '6ef160c3133a78de015830860197602ca1c855d3')
        def objcNatives = new File(repo, "${objcPath}-natives-osx.jar")
        if (!objcNatives.exists()) {
            def source = download('https://github.com/MinecraftMachina/Java-Objective-C-Bridge/releases/download/1.1.0-mmachina.1/java-objc-bridge-1.1.jar',
                    new File(downloadDir.get().asFile, 'java-objc-bridge-1.1.0-mmachina.1.jar'),
                    '369a83621e3c65496348491e533cb97fe5f2f37d')
            objcNatives.parentFile.mkdirs()
            new java.util.zip.ZipFile(source).withCloseable { zip ->
                new java.util.zip.ZipOutputStream(objcNatives.newOutputStream()).withCloseable { out ->
                    out.putNextEntry(new java.util.zip.ZipEntry('libjcocoa.dylib'))
                    zip.getInputStream(zip.getEntry('libjcocoa.dylib')).withCloseable { it.transferTo(out) }
                    out.closeEntry()
                }
            }
        }
    }
}

tasks.matching { it.name in ['runClient', 'slimeLauncherMetadataForForge'] }
        .configureEach { dependsOn 'stageLwjgl2Arm64Natives' }
tasks.withType(JavaCompile).configureEach { dependsOn 'stageLwjgl2Arm64Natives' }

def jechUiTestCleanReport = tasks.register('jechCleanUiTestReport', Delete) {
    group = 'verification'
    description = 'Deletes the previous JECh UI test run output.'
    if (jechUiTestRunDir == null) {
        delete providers.provider {
            def children = jechUiTestGameDir.listFiles()
            children == null ? [] : children.findAll { it.name != 'jech-scenarios' && it.name != 'mods' }
        }
    } else {
        delete jechUiTestOutDir
    }
}

def jechUiTestPresetOptions = tasks.register('jechPresetUiTestOptions') {
    group = 'verification'
    description = 'Writes the options.txt a bare harness run needs into the harness game directory.'
    onlyIf { jechUiTestSelection != null && jechUiTestRunDir == null }
    dependsOn jechUiTestCleanReport
    def outDir = jechUiTestGameDir
    inputs.property('jechUiTestOptions', 'onboardAccessibility:true\nlang:zh_CN\n')
    outputs.file(new File(outDir, 'options.txt'))
    doLast {
        def preset = new File(outDir, 'options.txt')
        preset.parentFile.mkdirs()
        preset.text = 'onboardAccessibility:true\nlang:zh_CN\n'
        logger.lifecycle("jechtest-uitest: preset ${preset} (${preset.text.trim().replace('\n', ', ')})")
    }
}

def jechUiTestVerify = tasks.register('verifyJechUiTest') {
    group = 'verification'
    description = 'Reads the UI test report and fails the build unless every scenario passed.'
    onlyIf { jechUiTestSelection != null }
    doLast {
        def report = new File(jechUiTestOutDir, 'report.json')
        if (!report.isFile()) {
            throw new GradleException(
                "no UI test report at ${report} - the client crashed, never reached the runner, "
                    + 'or -PjechTest matched no scenarios'
            )
        }
        def run = new groovy.json.JsonSlurper().parse(report)
        def totals = run.totals
        logger.lifecycle(
            "jechtest-uitest ${run.status}: ${totals.passed}/${totals.scenarios} scenarios passed, "
                + "${totals.checks - totals.checksFailed}/${totals.checks} checks passed, "
                + "${totals.captures} captures, ${run.durationMs} ms"
        )
        def failures = []
        if (run.status != 'PASS') {
            failures.add("run: ${run.status}")
        }
        run.scenarios.each { scenario ->
            if (scenario.status != 'PASS') {
                failures.add("scenario ${scenario.name}: ${scenario.status}"
                    + (scenario.message == null ? '' : " (${scenario.message})"))
            }
            scenario.steps.each { step ->
                if (step.status != 'PASS') {
                    logger.error("  step ${step.index} ${step.name}: ${step.status}"
                        + (step.waitingFor == null ? '' : " waitingFor=${step.waitingFor}"))
                    step.checks.each { check ->
                        if (!check.passed) {
                            logger.error("    check ${check.label} FAILED"
                                + (check.detail == null ? '' : " (${check.detail})"))
                        }
                    }
                    step.captures.each { capture ->
                        logger.error("    capture ${capture.path}"
                            + (capture.suspect ? ' SUSPECT flat colour' : ''))
                    }
                    if (step.error != null) {
                        logger.error("    error ${step.error.type}: ${step.error.message}")
                    }
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('UI test failed:\n  ' + failures.join('\n  '))
        }
    }
}

tasks.configureEach { task ->
    if (task.name != 'runClient' || jechUiTestSelection == null) return
    task.dependsOn jechUiTestCleanReport
    task.dependsOn jechUiTestPresetOptions
    task.finalizedBy jechUiTestVerify
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

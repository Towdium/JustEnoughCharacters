# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# The mod under test (its id is what the harness's mods.toml depends on).
mod_id=jecharacters

# The harness mod's own version, expanded into its mods.toml.
mod_version=1.0.0

# Platform — mirrors multiple-version/1.16.5/gradle.properties of the JECh
# checkout: Forge 36.2.42 is the version the built jar's own mods.toml demands
# (loaderVersion "forge [36.2.41,)"), and the one whose userdev carries the
# TransformationMatrix SRG-redirect fix (Forge PR #9883) this line depends on.
minecraft_version=1.16.5
forge_version=36.2.42

# The jars under test are NOT declared here: they are passed in as project
# properties on every run, by jt (which builds/pins them) or by hand —
#   ./gradlew runClient -PjechTest=tag:smoke \
#     -PjechJar=/abs/jecharacters-1.16.5-forge-4.6.12.jar \
#     -PjeiJar=/abs/jei-1.16.5-7.8.0.1009.jar
# so the harness always tests the artifact jt resolved, never a copy that could
# drift from it.

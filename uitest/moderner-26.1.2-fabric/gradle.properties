# Gradle — the wrapper is the moderner checkout's Gradle 9.5, which runs on the
# machine's default JDK; the client's JDK 25 comes from the toolchain below.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# The mod under test (its id is what the harness's fabric.mod.json depends on).
mod_id=jecharacters

# The harness mod's own version, expanded into its fabric.mod.json.
mod_version=1.0.0

# PinIn, the library the mod under test loads at runtime; compile-only here
# because the JECh jar under test embeds it (jar-in-jar) and the loader unpacks
# it, while the compiler needs it for the TreeSearcher signatures the recorder
# walks.
verpinin=1.6.0

# Platform — the 26.1.2 (unobfuscated) line of the moderner checkout, the same
# versions fabric-unobfuscated/gradle.properties carries. MC 26.x ships
# unobfuscated official jars, so the build declares no mappings at all and every
# jar of this line (fabric-api, JEI, JECh itself) is already in Mojang names.
minecraft_version=26.1.2
fabric_loader_version=0.19.2
# The fabric-api of the run: the same pinned version the env's fabric-api
# artifact names, taken as a plain Gradle dependency the way the checkout's
# fabric-unobfuscated module takes it (there is no remapping step to do).
fabric_version=0.146.1+26.1.2

# The jars under test are NOT declared here: they are passed in as project
# properties on every run, by jt (which builds/pins them) or by hand —
#   ./gradlew runClient -PjechTest=all \
#     -PjechJar=/abs/jecharacters-26.1.2-fabric-<build>.jar \
#     -PjeiJar=/abs/jei-26.1.2-fabric-29.16.0.46.jar
# so the harness always tests the artifact jt resolved, never a copy that could
# drift from it.

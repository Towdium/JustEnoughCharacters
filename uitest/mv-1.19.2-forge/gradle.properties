# Gradle — the daemon runs on the JDK jt hands over (17 for this line), and
# Gradle 8.10 is the wrapper this build pins (the same pair the local JEI
# 1.20.1 copy runs: MDG legacyforge 2.0.143 + Gradle 8.10).
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=false

# The mod under test (its id is what the harness's mods.toml depends on).
mod_id=jecharacters

# The harness mod's own version, expanded into its mods.toml.
mod_version=1.0.0

# Platform — mirrors multiple-version/1.19.2/gradle.properties of the JECh
# checkout (forge_version) and the pinned JEI 11.30.3.1056's own floor.
minecraft_version=1.19.2
forge_version=43.2.3
forge_version_range=[43,)
loader_version_range=[40,)
minecraft_version_range=[1.19.2,1.19.3)

# The jars under test are NOT declared here: they are passed in as project
# properties on every run, by jt (which builds/pins them) or by hand —
#   ./gradlew runClient -PjechTest=all \
#     -PjechJar=/abs/jecharacters-1.19.2-forge-4.6.12.jar \
#     -PjeiJar=/abs/jei-1.19.2-forge-11.30.3.1056.jar
# so the harness always tests the artifact jt resolved, never a copy that could
# drift from it.

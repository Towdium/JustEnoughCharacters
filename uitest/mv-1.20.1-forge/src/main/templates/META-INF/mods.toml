modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT License"

# The harness mixins belong to this mod alone, so they are applied only when this mod is loaded.
# No run except the harness run loads this mod, and the jecharacters jar never carries any of it.
# Forge picks the config up from the jar manifest's MixinConfigs attribute (production) and from
# the --mixin.config program argument ModDevGradle's `mixin { config ... }` wiring appends to every
# run (dev); the [[mixins]] section below is the NeoForge-only spelling and does not exist here.
[[mods]]
modId = "jechtest"
version = "${mod_version}"
displayName = "JECh UI Test Harness"
description = '''
    Dev-only UI test harness for Just Enough Characters: the scenario engine ported from the
    CloudLib in-client UI test harness (frame-clock runner, scenario DSL, synthetic/real input
    seams, screen capture and the JUnit/JSON report). Never shipped.
'''
authors = "vfyjxf_"

[[dependencies.jechtest]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.jechtest]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The engine drives the game through the mod under test's own code paths, so jecharacters has to be
# loaded first.
[[dependencies.jechtest]]
modId = "${mod_id}"
mandatory = true
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

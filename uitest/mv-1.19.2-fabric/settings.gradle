pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        // Stock fabric-loom (the plugin this build pins since it moved off
        // architectury-loom) resolves from the Fabric maven below — the same
        // repository the multiple-version checkout resolves it from. The
        // architectury maven this list used to carry went with architectury-loom.
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url "https://maven.fabricmc.net/" }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'jech-uitest-mv-1.19.2-fabric'

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 9.5.0 — the generation the multiple-version checkout builds this same
# line on, and the one stock fabric-loom 1.10.5 is pinned against here. (The
# wrapper was Gradle 8.1.1 for as long as the build ran architectury-loom 1.1,
# which needed that old generation; Gradle 9 requires a JDK 17+ to start.)
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

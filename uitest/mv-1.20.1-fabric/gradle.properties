# Gradle — the wrapper is Gradle 9.5.0, the generation the multiple-version
# checkout builds this line on and the one stock fabric-loom 1.10.5 is pinned
# against (see build.gradle's toolchain note). Gradle 9 refuses a JDK older than
# 17; JDK 17 runs the wrapper and is also the toolchain MC 1.20.1 compiles for.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# The mod under test (its id is what the harness's fabric.mod.json depends on).
mod_id=jecharacters

# The harness mod's own version, expanded into its fabric.mod.json.
mod_version=1.0.0

# PinIn, the library the mod under test shades into its own jar (its
# me/towdium/pinin classes sit unpacked inside the JECh jar); compile-only here
# because the JECh jar under test carries them at runtime, while the compiler
# needs the library for the TreeSearcher signatures the recorder's
# JechSearchStorage tap walks. 1.7.1 is the version the multiple-version
# checkout pins (its root gradle.properties verpinin), under that checkout's
# own coordinate dev.ghostflyby — jitpack no longer serves it, and the local
# Gradle cache the checkout's builds populated is the resolution source.
verpinin=1.7.1

# Platform — mirrors 1.20.1/gradle.properties of the multiple-version checkout.
minecraft_version=1.20.1
fabric_loader_version=0.16.14
# The fabric-api split this line inherited from the checkout, in two tracks —
# both pins kept exactly as they are. The split is the shape architectury-loom
# 1.1 forced; this row now runs stock fabric-loom 1.10.5, which reads every MC
# 1.20.1 fabric-api, so the limitation below is lifted and the split is a
# leftover rather than a requirement. It stays until someone decides to collapse
# it (a single fabric_version on mod* configurations), because collapsing it
# would change the run's input set — which is what the row's recorded verdicts
# were measured against.
#
# fabric_compile_version is the *compile* api only: 0.91.0+1.20.1 is the newest
# MC 1.20.1 fabric-api architectury-loom 1.1 could read. From 0.91.1 on, every
# 1.20.1 fabric-api is built by loom >= 1.5 and stamps
# `Fabric-Loom-Mixin-Remap-Type` into its manifest, which loom 1.1 rejected while
# configuring the project ("does not support the mixin remap type value") — the
# recorded dead end in 1.20.1/gradle.properties of the checkout. What the
# harness compiles against needs no newer api (the keybinding and client-command
# APIs the engine uses exist in 0.91.0).
#
# fabric_runtime_version is the api the dev run actually loads: jei 15.48.0.179
# requires fabric-api >=0.92.2+1.20.1, and 0.92.12+1.20.1 is the pinned artifact
# the env row names. It is NOT a mod* dependency here (loom 1.1 could not resolve
# it, see above): the build resolves it through a plain configuration — which
# loom never remaps or inspects — and stageUiTestMods copies that one jar into
# the run's mods/, where fabric-loader's dev remapper (loom passes
# -Dfabric.remapClasspathFile) brings it into the run's named namespace. Same
# road the checkout's own dev run took (its mv-1.20.1-fabric row was green with
# exactly this game-dir staging).
fabric_compile_version=0.91.0+1.20.1
fabric_runtime_version=0.92.12+1.20.1

# The jars under test are NOT declared here: they are passed in as project
# properties on every run, by jt (which builds/pins them) or by hand —
#   ./gradlew runClient -PjechTest=all \
#     -PjechJar=/abs/jecharacters-1.20.1-fabric-4.6.12.jar \
#     -PjeiJar=/abs/jei-1.20.1-fabric-15.48.0.179.jar
# so the harness always tests the artifact jt resolved, never a copy that could
# drift from it.

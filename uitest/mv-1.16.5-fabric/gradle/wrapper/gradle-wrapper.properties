distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 9.5.0 — the generation the multiple-version checkout runs its fabric
# modules on, which this row mirrors. The wrapper jar and gradlew script below are
# byte-identical to that checkout's (md5 56dfd1325535d644bf08c8df699d99b8), so
# only this URL changes. Gradle 9 runs on JDK 17+, where the previous 8.1.1
# wrapper could not start at all on the machine's default JDK; this row's compile
# level stays Java 8 either way (and the run's own JDK is the env's 17 — see
# build.gradle's java block for why the two are not the same declaration).
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
